name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build
        shell: cmd
        run: call build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: Hlebushek_Injector
          path: Hlebushek_Injector/bin/Hlebushek_Injector.exe
