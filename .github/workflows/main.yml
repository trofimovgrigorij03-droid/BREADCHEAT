name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Find and build project
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter build.bat -Recurse -File

          if (-not $files) {
            Write-Error "build.bat was not found in the repository."
            exit 1
          }

          $bat = $files | Select-Object -First 1
          Write-Host "Build script: $($bat.FullName)"

          cmd.exe /d /c "`"$($bat.FullName)`""
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hlebushek_Injector
          path: '**/bin/Hlebushek_Injector.exe'
          if-no-files-found: error
