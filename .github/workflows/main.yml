name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\Hlebushek_Injector"
          call build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hlebushek_Injector
          path: Hlebushek_Injector/bin/Hlebushek_Injector.exe
          if-no-files-found: error
